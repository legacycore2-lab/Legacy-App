name: Temp Format Dashboard

on:
  push:
    branches:
      - feature/dashboard-production-readiness
    paths:
      - .github/workflows/temp-format-dashboard.yml
      - src/features/dashboard/**

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/dashboard-production-readiness
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format dashboard files
        run: npx prettier --write "src/features/dashboard/**/*.{ts,tsx,css}"
      - name: Commit exact Prettier output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "Legacy CI"
          git config user.email "ci@legacycore.app"
          git add src/features/dashboard
          git commit -m "style(dashboard): apply exact prettier output"
          git push origin HEAD:feature/dashboard-production-readiness
