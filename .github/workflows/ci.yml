name: Build Check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=critical

      - name: Check formatting
        run: npm run format:check

      - name: Lint source
        run: npm run lint

      - name: Check architecture boundaries
        run: npm run architecture:test && npm run architecture:check

      - name: Run unit tests
        run: npm test

      - name: Install E2E browser
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout 5m npx playwright install chromium; then
              exit 0
            fi
            echo "Playwright Chromium download attempt ${attempt} failed or timed out. Retrying..."
            sleep 10
          done
          echo "Playwright Chromium installation failed after 2 attempts."
          exit 1

      - name: Run E2E smoke tests
        run: npm run test:e2e

      - name: Build application
        run: npm run build
