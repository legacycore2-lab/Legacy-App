name: Build Check

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier probe
        run: |
          npx prettier src/features/reports/services/reports-presentation.service.ts --write
          git diff -- src/features/reports/services/reports-presentation.service.ts
          exit 1
