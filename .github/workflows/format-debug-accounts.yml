name: Format Account Files

on:
  push:
    branches:
      - feature/unified-cash-bank-accounts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/unified-cash-bank-accounts
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format targets
        run: npx prettier --write src/features/accounts/components/AccountForm.tsx src/features/accounts/hooks/useAccountForm.ts src/features/accounts/services/accounts.service.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/accounts/components/AccountForm.tsx src/features/accounts/hooks/useAccountForm.ts src/features/accounts/services/accounts.service.test.ts
          git commit -m "style(accounts): apply prettier formatting"
          git push origin HEAD:feature/unified-cash-bank-accounts
