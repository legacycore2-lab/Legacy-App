name: Format Debug Account

on:
  push:
    branches:
      - feature/account-safe-delete

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format target
        run: npx prettier --write src/features/accounts/services/accounts.service.ts
      - name: Print formatted target
        run: |
          echo '---FORMATTED-START---'
          cat src/features/accounts/services/accounts.service.ts
          echo '---FORMATTED-END---'
