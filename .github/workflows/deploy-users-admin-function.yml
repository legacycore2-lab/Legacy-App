name: Deploy users admin function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/users-admin/**'
      - '.github/workflows/deploy-users-admin-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy users-admin --project-ref qsmlbjptgjtgjqvjosne
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
