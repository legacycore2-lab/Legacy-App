name: Temporary Format Commit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format project files
        run: npx prettier --write src/features/projects/components/ProjectDeleteDialog.tsx src/features/projects/pages/ProjectDetailsPage.tsx

      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-format-artifact.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/projects/components/ProjectDeleteDialog.tsx src/features/projects/pages/ProjectDetailsPage.tsx .github/workflows/temporary-format-artifact.yml
          git commit -m "style(projects): apply repository formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
