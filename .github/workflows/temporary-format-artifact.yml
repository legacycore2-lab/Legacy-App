name: Temporary Format Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format project files
        run: npx prettier --write src/features/projects/components/ProjectDeleteDialog.tsx src/features/projects/pages/ProjectDetailsPage.tsx

      - name: Upload formatted files
        uses: actions/upload-artifact@v6
        with:
          name: formatted-project-files
          path: |
            src/features/projects/components/ProjectDeleteDialog.tsx
            src/features/projects/pages/ProjectDetailsPage.tsx
          if-no-files-found: error
