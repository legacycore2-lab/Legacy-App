name: Temp Format Reports Presentation

on:
  push:
    branches:
      - feature/reports-production-readiness
    paths:
      - .github/workflows/temp-format-reports.yml
      - src/features/reports/services/reports-presentation.service.ts

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: feature/reports-production-readiness
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format target file
        run: npx prettier --write src/features/reports/services/reports-presentation.service.ts
      - name: Commit formatted file
        run: |
          if git diff --quiet -- src/features/reports/services/reports-presentation.service.ts; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/reports/services/reports-presentation.service.ts
          git commit -m "style(reports): apply prettier output"
          git push origin HEAD:feature/reports-production-readiness
