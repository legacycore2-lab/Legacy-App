name: Temp Format Journal Safety

on:
  push:
    branches:
      - feature/journal-safety-audit
    paths:
      - .github/workflows/temp-format-journal-safety.yml
      - src/features/journal/**
      - src/shared/attachments/**

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/journal-safety-audit
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format Journal and attachment files
        run: >-
          npx prettier --write
          "src/features/journal/**/*.{ts,tsx,css}"
          "src/shared/attachments/**/*.{ts,tsx,css}"
      - name: Commit exact Prettier output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "Legacy CI"
          git config user.email "ci@legacycore.app"
          git add src/features/journal src/shared/attachments
          git commit -m "style(journal): apply exact prettier output"
          git push origin HEAD:feature/journal-safety-audit
