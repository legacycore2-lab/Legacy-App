name: Format Reports Temp
on:
  push:
    branches:
      - feature/reports-production-readiness-v2
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/features/reports/services/reports-center-navigation.service.ts src/features/reports/services/tabular-export.service.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/reports/services/reports-center-navigation.service.ts src/features/reports/services/tabular-export.service.ts
          git commit -m "style(reports): apply prettier"
          git push
