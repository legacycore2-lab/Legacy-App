name: Format PR 116 Once

on:
  push:
    branches:
      - automation/format-pr-116-once

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: automation/format-pr-116-once

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npm run format

      - name: Remove one-time workflow and commit formatting
        run: |
          rm .github/workflows/format-pr-116-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "style: format project command center"
          git push origin HEAD:automation/format-pr-116-once
