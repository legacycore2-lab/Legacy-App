name: Format Probe

on:
  push:
    branches:
      - feature/reports-presentation-clean-final

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format target file
        run: npx prettier src/features/reports/services/reports-presentation.service.ts --write
      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: formatted-report-service
          path: src/features/reports/services/reports-presentation.service.ts
